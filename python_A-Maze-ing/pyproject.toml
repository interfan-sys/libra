[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator — 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]

[project.optional-dependencies]
dev = ["pytest", "flake8", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.pyright]
pythonVersion = "3.10"
include = ["mazegen", "src", "tests", "a_maze_ing.py"]
extraPaths = ["."]

[tool.mypy]
exclude = ["dist", "build", "venv", ".venv"]
